<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asistencia · JK44 Cinema Night</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0e0c0b">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root { --bg: #0e0c0b; --panel: #181513; --line: #2e2824; --cream: #f3ead9; --muted: #a39686; --red: #f0391f; --mustard: #e3ad3c; --green: #8fcf7a; color-scheme: dark;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--cream); font: 16px/1.45 "Archivo", "Helvetica Neue", Arial, sans-serif; }
[hidden] { display: none !important; }
.wrap { max-width: 760px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 18px; }
.k { font: 500 12px "IBM Plex Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font-stretch: 125%; font-weight: 900; text-transform: uppercase; font-size: clamp(28px, 7vw, 44px); line-height: 1; }
h1 span { color: var(--red); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
@media (max-width: 520px) { .stats { grid-template-columns: repeat(2, 1fr); } }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 12px; }
.stat b { display: block; font-stretch: 125%; font-weight: 900; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat.si b { color: var(--green); } .stat.no b { color: var(--red); } .stat.pend b { color: var(--mustard); }
.bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--line); }
.bar i { display: block; height: 100%; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.tools input { flex: 1 1 200px; min-width: 0; font: inherit; color: var(--cream); background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 10px 12px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs button { font: 600 13px "Archivo", sans-serif; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 3px; padding: 8px 10px; cursor: pointer; }
.tabs button[aria-pressed="true"] { color: var(--cream); border-color: var(--red); background: rgba(240,57,31,.12); }
input:focus-visible, button:focus-visible { outline: 2px solid var(--mustard); outline-offset: 2px; }
ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
li { display: grid; grid-template-columns: 48px 1fr auto; gap: 2px 12px; padding: 10px 2px; border-bottom: 1px solid var(--line); }
li .av { grid-row: 1 / span 2; grid-column: 1; width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background: var(--panel); border: 2px solid var(--line);
  display: grid; place-items: center; font: 800 16px "Archivo", sans-serif; color: var(--muted); }
li.si .av { border-color: var(--green); } li.no .av { border-color: var(--red); opacity: .6; }
li .n { grid-column: 2; font-weight: 600; overflow-wrap: anywhere; align-self: end; }
li .m { grid-column: 2; font: 12px "IBM Plex Mono", monospace; color: var(--muted); letter-spacing: .04em; align-self: start; }
li .r { grid-row: 1 / span 2; grid-column: 3; align-self: center; font: 600 13px "Archivo", sans-serif; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
li.si .r { color: var(--green); } li.no .r { color: var(--red); } li.pend .r { color: var(--muted); }
.msg { color: var(--muted); }
.foot { font: 12px "IBM Plex Mono", monospace; color: var(--muted); }
</style>
</head>
<body>
<main class="wrap">
  <div>
    <p class="k" style="margin:0 0 6px">JK44 Cinema Night · Jueves 3 dic · Sala Equis · Privado</p>
    <h1>Asistencia <span>en directo</span></h1>
  </div>

  <p class="msg" id="msg">Cargando…</p>

  <section id="app" hidden style="display:grid;gap:18px">
    <div class="stats">
      <div class="stat si"><span class="k">Vienen</span><b id="n-si">0</b></div>
      <div class="stat no"><span class="k">No pueden</span><b id="n-no">0</b></div>
      <div class="stat pend"><span class="k">Sin responder</span><b id="n-pend">0</b></div>
      <div class="stat"><span class="k">Plazas en lista</span><b id="n-all">0</b></div>
    </div>
    <div class="bar" aria-hidden="true"><i id="b-si" style="background:var(--green)"></i><i id="b-no" style="background:var(--red)"></i><i id="b-pend" style="background:var(--mustard);opacity:.5"></i></div>

    <div class="tools">
      <input id="q" type="search" placeholder="Buscar nombre…" autocomplete="off" aria-label="Buscar nombre">
    </div>
    <div class="tabs" role="group" aria-label="Filtrar">
      <button type="button" data-f="all" aria-pressed="true">Todos</button>
      <button type="button" data-f="si" aria-pressed="false">Vienen</button>
      <button type="button" data-f="no" aria-pressed="false">No pueden</button>
      <button type="button" data-f="pend" aria-pressed="false">Sin responder</button>
      <button type="button" data-f="ticket" aria-pressed="false">Con entrada</button>
    </div>
    <ul id="list"></ul>
    <p class="foot" id="updated"></p>
  </section>
</main>

<script src="../config.js?v=20261127a"></script>
<script>
(() => {
  const CFG = window.RSVP_CONFIG || {};
  const $ = (id) => document.getElementById(id);
  const key = new URLSearchParams(location.search).get("k") || "";
  let rows = [], filter = "all", photos = {};
  const state = (r) => r.response === "si" ? "si" : r.response === "no" ? "no" : "pend";
  const hhmm = (s) => s ? new Date(s).toLocaleString("es-ES", { weekday: "short", hour: "2-digit", minute: "2-digit", timeZone: "Europe/Madrid" }) : "";

  function render() {
    const c = { si: 0, no: 0, pend: 0 }, seats = { si: 0 };
    rows.forEach((r) => { c[state(r)]++; if (state(r) === "si") seats.si += r.quantity; });
    $("n-si").textContent = seats.si; $("n-no").textContent = c.no; $("n-pend").textContent = c.pend;
    $("n-all").textContent = rows.reduce((n, r) => n + r.quantity, 0);
    const tot = rows.length || 1;
    $("b-si").style.width = (c.si / tot * 100) + "%"; $("b-no").style.width = (c.no / tot * 100) + "%"; $("b-pend").style.width = (c.pend / tot * 100) + "%";
    const q = $("q").value.trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
    const order = { si: 0, no: 1, pend: 2 };
    const shown = rows
      .filter((r) => filter === "all" || (filter === "ticket" ? r.kind === "ticket" : state(r) === filter))
      .filter((r) => !q || (r.name || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").includes(q))
      .sort((a, b) => order[state(a)] - order[state(b)] || (a.name || "").localeCompare(b.name || "", "es"));
    const ul = $("list"); ul.textContent = "";
    for (const r of shown) {
      const li = document.createElement("li"), s = state(r); li.className = s;
      const n = document.createElement("span"); n.className = "n"; n.textContent = r.name || "(sin nombre)";
      const m = document.createElement("span"); m.className = "m";
      m.textContent = (r.kind === "ticket" ? `Entrada · ${r.quantity} plaza${r.quantity === 1 ? "" : "s"}` : "Invitado") +
        (r.responded_at ? ` · ${hhmm(r.responded_at)}` : r.sent ? " · email enviado" : " · email pendiente");
      const st = document.createElement("span"); st.className = "r"; st.textContent = s === "si" ? "✓ Viene" : s === "no" ? "✗ No" : "—";
      let av;
      if (r.ref && photos[r.ref]) { av = document.createElement("img"); av.src = photos[r.ref]; av.alt = ""; av.loading = "lazy"; }
      else { av = document.createElement("span"); av.textContent = (r.name || "?").trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join("").toUpperCase(); }
      av.className = "av";
      li.append(av, n, st, m); ul.appendChild(li);
    }
    if (!shown.length) { const li = document.createElement("li"); li.className = "pend"; li.innerHTML = '<span class="n" style="color:var(--muted)">Nadie con este filtro</span>'; ul.appendChild(li); }
  }

  // guest photos come from the public guest list (same one the RSVP page shows); loaded once, they rarely change
  async function loadPhotos(headers) {
    try {
      const r = await fetch(`${CFG.supabaseUrl.replace(/\/$/, "")}/rest/v1/rpc/guest_list`, { method: "POST", headers, body: "{}" });
      if (!r.ok) return;
      for (const g of (await r.json()) || []) if (typeof g.photo === "string" && g.photo.startsWith("data:image/")) photos[g.id] = g.photo;
      render();
    } catch {}
  }

  async function load() {
    const headers = { apikey: CFG.supabaseKey, "Content-Type": "application/json" };
    if ((CFG.supabaseKey || "").startsWith("eyJ")) headers.Authorization = "Bearer " + CFG.supabaseKey;
    try {
      const r = await fetch(`${CFG.supabaseUrl.replace(/\/$/, "")}/rest/v1/rpc/attendance_report`, { method: "POST", headers, body: JSON.stringify({ p_key: key }) });
      if (!r.ok) { $("msg").textContent = "Enlace no válido. Usa el enlace privado completo."; $("msg").hidden = false; $("app").hidden = true; return; }
      rows = (await r.json()) || [];
      $("msg").hidden = true; $("app").hidden = false;
      $("updated").textContent = "Actualizado " + new Date().toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" }) + " · se refresca solo cada minuto";
      render();
      if (!Object.keys(photos).length) loadPhotos(headers);
    } catch { $("msg").textContent = "Sin conexión. Reintentando…"; }
  }

  $("q").addEventListener("input", render);
  document.querySelectorAll("[data-f]").forEach((b) => b.onclick = () => {
    filter = b.dataset.f;
    document.querySelectorAll("[data-f]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    render();
  });
  if (!key) { $("msg").textContent = "Esta página es privada. Usa el enlace con la clave."; return; }
  load();
  setInterval(() => { if (!document.hidden) load(); }, 60000);
})();
</script>
</body>
</html>
